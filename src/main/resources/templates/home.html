<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Home</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background: #f8f9fa;
}

.home-box {
	max-width: 600px;
	margin: 100px auto;
	padding: 30px;
	background: #fff;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	text-align: center;
}
</style>
</head>
<body>
	<div class="home-box">
		<h2>Welcome!</h2>
		<p>You have successfully logged in.</p>

		<p th:text="'Logged in as: ' + ${email}"></p>

		<a href="/logout" class="btn btn-primary mt-3">Logout</a>
	</div>
</body>
</html>

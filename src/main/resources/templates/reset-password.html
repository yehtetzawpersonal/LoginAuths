<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Reset Password</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
body {
	background: #f8f9fa;
}

.login-box {
	max-width: 400px;
	margin: 100px auto;
	padding: 30px;
	background: #fff;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
</head>

<body>
	<div class="login-box">
		<h3 class="text-center mb-4">Reset Password</h3>

		<form th:action="@{/reset-password}" method="post"
			onsubmit="return validateForm();">
			<input type="hidden" name="token" th:value="${token}" />

			<div class="mb-3">
				<label>New Password</label>
				<div class="input-group">
					<input type="password" name="password" id="password"
						class="form-control" required
						oninput="validatePassword(); hideMessage()"> <span
						class="input-group-text" style="cursor: pointer"
						onclick="togglePassword('password','eyePassword')"> <i
						class="bi bi-eye" id="eyePassword"></i>
					</span>
					<div class="invalid-feedback">Password must be 8–20
						characters and include letters and numbers.</div>
				</div>
			</div>

			<div class="mb-3">
				<label>Confirm Password</label>
				<div class="input-group">
					<input type="password" name="confirmPassword" id="confirmPassword"
						class="form-control" required
						oninput="validateConfirmPassword(); hideMessage()"> <span
						class="input-group-text" style="cursor: pointer"
						onclick="togglePassword('confirmPassword','eyeConfirm')"> <i
						class="bi bi-eye" id="eyeConfirm"></i>
					</span>
					<div class="invalid-feedback">Passwords do not match.</div>
				</div>
			</div>

			<div th:if="${error}" id="errorMessage" class="alert alert-danger">[[${error}]]</div>

			<button type="submit" class="btn btn-primary w-100">Reset
				Password</button>
		</form>

		<div class="text-center mt-3">
			<a th:href="@{/login}">Back to log In</a>
		</div>
	</div>

	<script>
		function togglePassword(inputId, eyeId) {
			const input = document.getElementById(inputId);
			const eye = document.getElementById(eyeId);

			if (input.type === "password") {
				input.type = "text";
				eye.classList.replace("bi-eye", "bi-eye-slash");
			} else {
				input.type = "password";
				eye.classList.replace("bi-eye-slash", "bi-eye");
			}
		}
	</script>

	<script>
		function hideMessage() {
			const error = document.getElementById("errorMessage");
			if (error) {
				error.style.display = "none";
			}
		}
	</script>

	<script>
		function validatePassword() {
			const password = document.getElementById("password");
			const value = password.value;

			// 8–20 chars, at least 1 letter and 1 number
			const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}$/;

			if (!regex.test(value)) {
				password.classList.add("is-invalid");
				password.classList.remove("is-valid");
				validateConfirmPassword(); // re-check confirm password
				return false;
			}

			password.classList.remove("is-invalid");
			password.classList.add("is-valid");
			validateConfirmPassword();
			return true;
		}

		function validateConfirmPassword() {
			const password = document.getElementById("password").value;
			const confirm = document.getElementById("confirmPassword");

			// If confirm is empty, don't show error yet
			if (confirm.value === "") {
				confirm.classList.remove("is-invalid", "is-valid");
				return false;
			}

			if (confirm.value !== password) {
				confirm.classList.add("is-invalid");
				confirm.classList.remove("is-valid");
				return false;
			}

			confirm.classList.remove("is-invalid");
			confirm.classList.add("is-valid");
			return true;
		}

		function validateForm() {
			const passOk = validatePassword();
			const confirmOk = validateConfirmPassword();

			return passOk && confirmOk;
		}
	</script>

</body>
</html>

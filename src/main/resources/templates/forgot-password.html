<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Forgot Password</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f8f9fa;
}

.login-box {
	max-width: 400px;
	margin: 100px auto;
	padding: 30px;
	background: #fff;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
</head>

<body>
	<div class="login-box">
		<h3 class="text-center mb-4">Forgot Your Password?</h3>

		<form th:action="@{/forgot-password}" method="post">
			<div class="mb-3">
				<label>Email Address</label> <input type="email" name="email"
					class="form-control" placeholder="example@gmail.com" required
					onfocus="hideMessage()">
			</div>

			<div th:if="${message}" id="successMessage"
				class="alert alert-success">[[${message}]]</div>


			<button type="submit" class="btn btn-primary w-100">Send
				Reset Link</button>
		</form>

		<div class="text-center mt-3">
			<a th:href="@{/login}">Back to log In</a>
		</div>
	</div>

	<script>
		function hideMessage() {
			const success = document.getElementById("successMessage");

			if (success) {
				success.style.display = "none";

			}
		}
	</script>
</body>
</html>
